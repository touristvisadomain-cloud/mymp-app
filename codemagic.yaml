# Codemagic builds for আমার এমপি (bd.mymp.app).
#
#   android-check    every push to main: analyze and test, nothing is signed.
#   android-release  a tag like v1.2.4: analyze, test, then the Play bundle
#                    (AAB) signed with the upload key, plus an APK for phones.
#   ios-release      a tag like v1.2.4: analyze, test, then an App Store build
#                    (IPA) uploaded to App Store Connect for TestFlight.
#
# The app is added to Codemagic by its public URL, not through the GitHub
# integration, so pushes and tags do not reach Codemagic: start each build
# from "Start new build".
#
# The upload key is never in this repository. Upload the .jks once in
# Codemagic under Team settings > Code signing identities > Android keystores
# with the reference name mymp_upload; the release workflow asks for it below
# and fails, rather than signing with the debug key, when it is missing.
#
# iOS signs with the App Store Connect API key (integration mymp_app_store_key,
# added under Settings > Integrations) and the distribution certificate and App Store profile
# for bd.mymp.app under Code signing identities.
#
# The Google Maps keys are never in this repository either. Add them once in
# Codemagic under the app's Environment variables, in a group named
# google_maps, both marked Secret:
#   MAPS_API_KEY      the Android key (android/app/build.gradle.kts reads it)
#   MAPS_API_KEY_IOS  the iOS key, written into ios/Flutter/MapsKey.xcconfig
# A release without its key stops, rather than quietly shipping the drawn
# maps. The Android key must allow the upload key's SHA-1 (the APK below) and
# Play's app signing key's SHA-1 (the app from Play): both are on Play Console
# > Test and release > App integrity.
#
# Play and Apple both need a higher build number on every upload: raise the
# number after the + in pubspec.yaml (version: 1.2.4+7) before a release.

workflows:
  android-check:
    name: Check (analyze and test)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.8
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        # The whole project, test/ included: an analyzer error anywhere would
        # also stop the release build.
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test

  android-release:
    name: Android release (signed AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      android_signing:
        - mymp_upload
      groups:
        - google_maps
      vars:
        # android/app/build.gradle.kts fails the build without the upload key
        # instead of quietly signing with the debug key.
        REQUIRE_UPLOAD_KEY: "true"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Check the Maps key is here
        script: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "No MAPS_API_KEY: add it to the google_maps group (see the top of codemagic.yaml)."
            exit 1
          fi
      - name: Build app bundle (for Play)
        script: flutter build appbundle --release
      - name: Build APK (for phones)
        script: flutter build apk --release
      - name: Check the bundle is signed with the upload key
        script: |
          set -e
          AAB=build/app/outputs/bundle/release/app-release.aab
          OWNER=$(keytool -printcert -jarfile "$AAB" | grep -m1 "Owner:" || true)
          echo "Signed by: $OWNER"
          if [ -z "$OWNER" ] || echo "$OWNER" | grep -q "Android Debug"; then
            echo "The bundle is not signed with the upload key; Play would refuse it."
            exit 1
          fi
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt
    # Uncomment to have finished builds emailed, or to upload to Play's
    # internal testing track once a Google Play service account is added in
    # Codemagic (Team settings > Integrations > Google Play):
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: mymp_app_store_key
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
      groups:
        - google_maps
      ios_signing:
        distribution_type: app_store
        bundle_identifier: bd.mymp.app
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Test
        script: flutter test
      - name: Maps key
        # ios/Flutter/Release.xcconfig includes this file when it is there.
        script: |
          if [ -z "$MAPS_API_KEY_IOS" ]; then
            echo "No MAPS_API_KEY_IOS: add it to the google_maps group (see the top of codemagic.yaml)."
            exit 1
          fi
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY_IOS" > ios/Flutter/MapsKey.xcconfig
      - name: Use the App Store profile
        # Points the Xcode project at the profile ios_signing fetched above,
        # and writes the export options flutter build ipa reads.
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sending a build to App Review stays a human decision.
        submit_to_app_store: false
